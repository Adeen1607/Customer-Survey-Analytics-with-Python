name: Survey quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install survey and test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8.0,<9.0"
      - name: Compile source
        run: python -m compileall -q src
      - name: Run workbook regression tests
        run: python -m pytest -q tests
